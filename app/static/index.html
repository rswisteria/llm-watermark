<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM 透かしサービス</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #637087;
      --line: #d9e0ea;
      --panel: #ffffff;
      --wash: #f4f7fb;
      --brand: #2457d6;
      --brand-dark: #173b9b;
      --danger: #b42318;
      --success: #087443;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--wash);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100% - 2rem, 900px); margin: 0 auto; padding: 2.5rem 0; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.7rem, 4vw, 2.35rem); }
    h2 { margin: 0 0 .85rem; font-size: 1.25rem; }
    .intro { margin: 0 0 1.5rem; color: var(--muted); }
    .warning {
      margin: 0 0 1.5rem;
      padding: .85rem 1rem;
      border: 1px solid #f0c36d;
      border-radius: .7rem;
      color: #704d00;
      background: #fff8e6;
    }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; }
    .tab { border: 1px solid var(--line); background: #e9eef7; color: var(--ink); }
    .tab[aria-selected="true"] { border-color: var(--brand); background: var(--brand); color: #fff; }
    .panel { padding: clamp(1rem, 3vw, 1.5rem); border: 1px solid var(--line); border-radius: .9rem; background: var(--panel); box-shadow: 0 8px 30px #1720330d; }
    label { display: block; margin-bottom: .4rem; font-weight: 650; }
    textarea { display: block; width: 100%; min-height: 10rem; resize: vertical; padding: .8rem; border: 1px solid #aeb9c9; border-radius: .55rem; color: inherit; background: #fff; font: inherit; }
    button { cursor: pointer; border: 0; border-radius: .5rem; padding: .65rem 1rem; font: inherit; font-weight: 650; }
    button:disabled { cursor: wait; opacity: .55; }
    .primary { margin-top: .85rem; color: #fff; background: var(--brand); }
    .primary:hover:not(:disabled), .tab:hover:not([aria-selected="true"]) { background: var(--brand-dark); color: #fff; }
    pre { min-height: 7rem; margin: 1.25rem 0 0; padding: 1rem; overflow: auto; white-space: pre-wrap; border-radius: .55rem; background: #162033; color: #edf3ff; }
    .result { margin-top: 1.25rem; padding: 1rem; border-radius: .55rem; background: #eef3ff; }
    .result strong { display: block; margin-bottom: .35rem; font-size: 1.1rem; }
    .result.error { color: var(--danger); background: #fff0ee; }
    .result.success { color: var(--success); background: #edfbf3; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .65rem; margin: .75rem 0 0; }
    .stats div { padding: .45rem .65rem; border: 1px solid #d7e0ef; border-radius: .4rem; background: #fff; }
    .stats dt { color: var(--muted); font-size: .82rem; }
    .stats dd { margin: 0; font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { main { width: min(100% - 1rem, 900px); padding: 1.25rem 0; } .tabs button { flex: 1; } }
  </style>
</head>
<body>
  <main>
    <h1>LLM 透かしサービス</h1>
    <p class="intro">テキストを生成し、電子透かしの統計的な判定を確認できます。</p>
    <p class="warning" role="note">本サービスで生成されたテキストのみ判定可能(一般的なAI生成判定器ではない)。同一トークナイザー・同一キーが必要です。</p>

    <nav class="tabs" aria-label="機能">
      <button class="tab" type="button" data-tab="generate" aria-selected="true" aria-controls="generate-panel">生成</button>
      <button class="tab" type="button" data-tab="detect" aria-selected="false" aria-controls="detect-panel">判定</button>
    </nav>

    <section id="generate-panel" class="panel" data-panel="generate">
      <h2>透かし付きで生成</h2>
      <label for="prompt">プロンプト</label>
      <textarea id="prompt" maxlength="2000" placeholder="生成したい文章のテーマを入力してください"></textarea>
      <button id="generate-button" class="primary" type="button">透かし付きで生成</button>
      <pre id="generated-text" aria-live="polite"></pre>
      <output id="generation-result" class="result" aria-live="polite" hidden></output>
    </section>

    <section id="detect-panel" class="panel" data-panel="detect" hidden>
      <h2>テキストを判定</h2>
      <label for="detect-text">判定するテキスト</label>
      <textarea id="detect-text" maxlength="10000" placeholder="本サービスで生成されたテキストを貼り付けてください"></textarea>
      <button id="detect-button" class="primary" type="button">判定する</button>
      <output id="detection-result" class="result" aria-live="polite" hidden></output>
    </section>
  </main>

  <script>
    (() => {
      const tabs = document.querySelectorAll('[data-tab]');
      const panels = document.querySelectorAll('[data-panel]');
      const generateButton = document.getElementById('generate-button');
      const detectButton = document.getElementById('detect-button');
      const generatedText = document.getElementById('generated-text');
      const generationResult = document.getElementById('generation-result');
      const detectionResult = document.getElementById('detection-result');

      tabs.forEach((tab) => tab.addEventListener('click', () => {
        const selected = tab.dataset.tab;
        tabs.forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
        panels.forEach((panel) => { panel.hidden = panel.dataset.panel !== selected; });
      }));

      function statsMarkup(detection) {
        return '<dl class="stats">' +
          '<div><dt>トークン数</dt><dd>' + detection.num_tokens + '</dd></div>' +
          '<div><dt>z</dt><dd>' + Number(detection.z_score).toFixed(3) + '</dd></div>' +
          '<div><dt>p</dt><dd>' + Number(detection.p_value).toExponential(3) + '</dd></div>' +
          '<div><dt>しきい値</dt><dd>' + detection.threshold + '</dd></div>' +
          '</dl>';
      }

      function showResult(element, title, detection, extraClass) {
        element.className = 'result' + (extraClass ? ' ' + extraClass : '');
        element.innerHTML = '<strong>' + title + '</strong>' + statsMarkup(detection);
        element.hidden = false;
      }

      function verdictLabel(verdict) {
        return { watermarked: '透かしあり', not_watermarked: '透かしなし', inconclusive: '判定不能' }[verdict] || '不明';
      }

      async function readSse(response, onEvent) {
        if (!response.ok || !response.body) throw new Error('生成リクエストに失敗しました。');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const consume = (record) => {
          const lines = record.split(/\r?\n/);
          let event = 'message';
          let data = '';
          lines.forEach((line) => {
            if (line.startsWith('event:')) event = line.slice(6).trim();
            if (line.startsWith('data:')) data += line.slice(5).trim();
          });
          if (data) onEvent(event, JSON.parse(data));
        };
        while (true) {
          const part = await reader.read();
          buffer += decoder.decode(part.value || new Uint8Array(), { stream: !part.done });
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            consume(buffer.slice(0, boundary));
            buffer = buffer.slice(boundary + 2);
          }
          if (part.done) break;
        }
        if (buffer.trim()) consume(buffer);
      }

      generateButton.addEventListener('click', async () => {
        const prompt = document.getElementById('prompt').value.trim();
        if (!prompt) return;
        generateButton.disabled = true;
        generatedText.textContent = '';
        generationResult.hidden = true;
        try {
          const response = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
          await readSse(response, (event, payload) => {
            if (event === 'token') generatedText.textContent += payload.text || '';
            if (event === 'done') showResult(generationResult, '生成完了: ' + verdictLabel(payload.detection.verdict), payload.detection, payload.detection.verdict === 'watermarked' ? 'success' : '');
            if (event === 'error') { generationResult.className = 'result error'; generationResult.textContent = payload.message || '生成中にエラーが発生しました。'; generationResult.hidden = false; }
          });
        } catch (error) { generationResult.className = 'result error'; generationResult.textContent = error.message; generationResult.hidden = false; }
        finally { generateButton.disabled = false; }
      });

      detectButton.addEventListener('click', async () => {
        const text = document.getElementById('detect-text').value.trim();
        if (!text) return;
        detectButton.disabled = true;
        detectionResult.hidden = true;
        try {
          const response = await fetch('/api/detect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
          if (!response.ok) throw new Error('判定リクエストに失敗しました。');
          const detection = await response.json();
          const message = detection.verdict === 'inconclusive' ? 'テキストが短すぎて判定できません。' : verdictLabel(detection.verdict);
          showResult(detectionResult, message, detection, detection.verdict === 'watermarked' ? 'success' : '');
        } catch (error) { detectionResult.className = 'result error'; detectionResult.textContent = error.message; detectionResult.hidden = false; }
        finally { detectButton.disabled = false; }
      });
    })();
  </script>
</body>
</html>
